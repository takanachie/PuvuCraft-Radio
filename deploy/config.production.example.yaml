version: 1

app:
  name: "PuvuCraft Radio"
  environment: "production"
  timezone: "Asia/Shanghai"
  public_base_url: "https://radio.example.com"

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  proxy_headers: true
  trusted_proxies:
    - "127.0.0.1"
    - "::1"

paths:
  data_dir: "/opt/radio/data"
  cover_dir: "/opt/radio/data/covers"
  hls_dir: "/opt/radio/data/runtime/hls"
  log_dir: "/opt/radio/data/logs"
  bootstrap_token_file: "/opt/radio/data/bootstrap.token"

database:
  url: "sqlite:////opt/radio/data/radio.db"
  sqlite_wal: true
  sqlite_synchronous: "FULL"
  sqlite_mmap_size_bytes: 67108864
  sqlite_cache_size_kib: 2048
  sqlite_journal_size_limit_bytes: 16777216
  pool_size: 5
  pool_max_overflow: 10
  pool_timeout_seconds: 5
  busy_timeout_ms: 5000

auth:
  secret_key: "${RADIO_SECRET_KEY}"
  password_hash: "argon2id"
  registration:
    enabled: true
    require_approval: true
    require_email: true
    require_email_verification: false
  password_policy:
    min_length: 10
    max_length: 128
  session:
    cookie_name: "radio_session"
    ttl_hours: 168
    idle_timeout_hours: 24
    secure_cookie: true
    same_site: "lax"
  csrf:
    enabled: true
    cookie_name: "radio_csrf"
    header_name: "X-CSRF-Token"
  rate_limits:
    login_per_minute: 10
    register_per_hour: 5
    setup_per_minute: 5

bootstrap:
  mode: "first_visit"
  require_one_time_token: true

media:
  max_upload_bytes: 524288000
  allowed_extensions:
    - ".mp3"
    - ".flac"
    - ".m4a"
    - ".aac"
    - ".wav"
    - ".ogg"
  import_directories:
    - "/opt/radio/data/import"
  deduplicate_by: "sha256"
  duplicate_policy: "reuse"
  missing_file_policy: "mark_unavailable"
  metadata:
    extract_tags: true
    extract_embedded_cover: true
    allow_admin_edit: true

uploads:
  temp_dir: "/opt/radio/tmp"
  queue_limit: 20
  max_concurrent: 5
  ready_lease_seconds: 120
  heartbeat_interval_seconds: 5
  heartbeat_timeout_seconds: 15
  progress_checkpoint_bytes: 4194304
  history_limit: 100

storage:
  locations:
    - id: "primary"
      root: "/opt/radio/data/media"
      priority: 100
      max_usage_percent: 90
      enabled: true
      create_if_missing: false
    # For every additional mount, also extend RequiresMountsFor and
    # ReadWritePaths in radio.service with that absolute root.
    # - id: "secondary"
    #   root: "/mnt/radio-secondary/media"
    #   priority: 50
    #   max_usage_percent: 85
    #   enabled: true
    #   create_if_missing: false

ffmpeg:
  binary: "/usr/bin/ffmpeg"
  ffprobe_binary: "/usr/bin/ffprobe"
  log_level: "warning"
  restart:
    initial_delay_seconds: 1
    max_delay_seconds: 30
    max_failures_before_offline: 10

streaming:
  always_on: false
  idle_shutdown_seconds: 30
  require_authenticated_session: true
  output:
    codec: "aac"
    profile: "aac_low"
    bitrate: "320k"
    sample_rate: 48000
    channels: 2
    sample_bits: 32
  hls:
    segment_container: "mpegts"
    segment_duration_seconds: 2
    playlist_segments: 3
    delete_old_segments: true
    delete_threshold: 2
  playback:
    default_mode: "sequential"
    allowed_modes:
      - "sequential"
      - "shuffle"
    loop: true
    transition: "direct"
    recovery: "timeline"
    state_checkpoint_seconds: 5
  process_control:
    shutdown_timeout_seconds: 10
    stale_output_cleanup: true

stream_access:
  nginx_auth_request_path: "/api/internal/stream-auth"
  authorization_cache_seconds: 5
  listener_timeout_seconds: 10
  max_listeners: 50
  allow_anonymous: false

player_api:
  title: "PuvuFM"
  connect_before_days: 30
  queue_seconds: 5
  takeover_timeout_seconds: 10
  startup_timeout_seconds: 10
  lossless:
    codec: "flac"
    sample_rate: 44100
    channels: 2
    sample_bits: 16
    compression_level: 5

events:
  transport: "sse"
  heartbeat_seconds: 15
  playback_position_interval_seconds: 2

frontend:
  theme: "dark_radio_console"
  default_locale: "zh-CN"
  show_full_playlist: true
  show_seek_control: false
  return_to_live_on_resume: true

seed:
  channels:
    - name: "Default"
      slug: "default"
      description: "Default music channel"
      enabled: true
      playback_mode: "sequential"
      display_order: 1

logging:
  level: "INFO"
  format: "json"
  file: "/opt/radio/data/logs/radio.log"
  max_bytes: 10485760
  backup_count: 5
