# Install in /etc/nginx/sites-available/radio after replacing radio.example.com.
# The map, log_format, and upstream directives must remain in nginx's http context.

map $uri $radio_cache_control {
    default                              "";
    ~*^/hls/.*\.m3u8$                   "no-store, no-cache, must-revalidate, max-age=0";
    ~*^/hls/.*\.ts$                     "private, max-age=8, immutable";
    ~*^/hls(?:/|$)                      "no-store";
    ~*^/assets/                         "public, max-age=31536000, immutable";
    /index.html                         "no-cache";
}

# Deliberately omit query strings so credentials or tokens cannot enter access logs.
log_format radio_no_query '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_user_agent" rt=$request_time';

upstream radio_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name radio.example.com;

    server_tokens off;
    access_log /var/log/nginx/radio.access.log radio_no_query;
    error_log /var/log/nginx/radio.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://radio.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radio.example.com;

    ssl_certificate /etc/letsencrypt/live/radio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:radio_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # JSON and anonymous endpoints stay small. Authenticated media locations override this.
    client_max_body_size 1m;
    access_log /var/log/nginx/radio.access.log radio_no_query;
    error_log /var/log/nginx/radio.error.log warn;

    root /opt/radio/frontend/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Without "always", denied HLS requests cannot acquire the segment cache policy.
    add_header Cache-Control $radio_cache_control always;

    # This exact URI is reachable only as an Nginx auth_request subrequest.
    location = /api/internal/stream-auth {
        internal;
        proxy_pass http://radio_backend/api/internal/stream-auth;
        proxy_http_version 1.1;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /api/internal/admin-auth {
        internal;
        proxy_pass http://radio_backend/api/internal/admin-auth;
        proxy_http_version 1.1;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Authorize before Nginx accepts a large media body. One MiB covers multipart framing.
    location = /api/admin/tracks/upload {
        client_max_body_size 501m;
        auth_request /api/internal/admin-auth;
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    location ~ ^/api/admin/tracks/[0-9]+/cover$ {
        client_max_body_size 11m;
        auth_request /api/internal/admin-auth;
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 1m;
        proxy_send_timeout 1m;
    }

    # Preserve /api exactly. Buffering is disabled for the whole API namespace so
    # every current or future SSE event endpoint streams immediately.
    location = /api {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Authenticate the bare path too; it must not fall through to the SPA.
    location = /hls {
        auth_request /api/internal/stream-auth;
        root /opt/radio/data/runtime;
        try_files /hls/__not_a_file__ =404;
    }

    # root + the original URI maps /hls/x to /opt/radio/data/runtime/hls/x.
    location ^~ /hls/ {
        auth_request /api/internal/stream-auth;
        root /opt/radio/data/runtime;
        try_files $uri =404;
        gzip off;
        sendfile on;
        tcp_nopush on;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        default_type application/octet-stream;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
