# Temporary HTTP-only site used to obtain the first certificate with Certbot.
# Replace this file with radio.nginx.conf after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name radio.example.com;

    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
